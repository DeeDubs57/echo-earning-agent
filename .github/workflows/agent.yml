name: earning-agent

# Runs on GitHub's servers every 30 minutes, even when your computer is off.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earning-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run agent
        env:
          SUPERTEAM_API_KEY: ${{ secrets.SUPERTEAM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node agent.mjs
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "status @ $(date -u +%FT%TZ)"
          git push
      - name: Email owner on payment or merge
        if: always()
        run: |
          if [ -f NOTIFY.txt ]; then
            echo "::error title=EARNING EVENT::$(cat NOTIFY.txt)"
            exit 1
          fi
          echo "no earning event this run"
